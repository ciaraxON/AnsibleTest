---
- name: Deploy files from GitHub repo to server
  hosts: virtuabox
  become: true

  vars:
    src_repo: "{{ playbook_dir }}/../filestodeploy"   # on controller
    dest_dir: "/opt/app/destination"                  # on remote
    backup_dir: "/opt/app/backups"
    release_id: "{{ release_id | default(ansible_date_time.iso8601_basic_short) }}"
    rsync_backup_dir: "{{ backup_dir }}/rsync_{{ release_id }}"

  tasks:
    - name: Ensure destination directory exists
      ansible.builtin.file:
        path: "{{ dest_dir }}"
        state: directory
        mode: "0775"

    - name: Ensure backup directory exists
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure required packages are installed (Ubuntu)
      ansible.builtin.apt:
        name:
          - rsync
          - dos2unix
        state: present
        update_cache: true

    - name: Create timestamped backup folder for overwritten files
      ansible.builtin.file:
        path: "{{ rsync_backup_dir }}"
        state: directory
        mode: "0755"

    - name: Sync only new/changed files; backup any overwritten destination files
      ansible.posix.synchronize:
        src: "{{ src_repo }}/"
        dest: "{{ dest_dir }}/"
        mode: push
        archive: true
        delete: false
        rsync_opts:
          - "--backup"
          - "--backup-dir={{ rsync_backup_dir }}"
          - "--suffix=.bak"
          - "--chmod=Du=rwx,Dg=rwx,Do=rx,Fu=rwx,Fg=rwx,Fo=rx"  # 775 dirs/files

    - name: Convert destination files to Unix line endings
      ansible.builtin.shell: |
        find "{{ dest_dir }}" -type f -print0 | xargs -0 dos2unix
      args:
        executable: /bin/bash