---
- name: Deploy files from GitHub repo to server
  hosts: virtuabox
  become: true
  gather_facts: true

  vars:
    src_repo: "{{ playbook_dir }}/../filestodeploy"
    dest_dir: "/opt/app/destination"
    backup_dir: "/opt/app/backups"
    release_id: "{{ release_id | default(ansible_date_time.iso8601_basic_short) }}"
    rsync_backup_dir: "{{ backup_dir }}/{{ release_id }}"

  tasks:
    - name: Ensure destination directory exists
      ansible.builtin.file:
        path: "{{ dest_dir }}"
        state: directory
        mode: "0775"

    - name: Ensure backup root directory exists
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure release backup directory exists
      ansible.builtin.file:
        path: "{{ rsync_backup_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure rsync is installed on remote host
      ansible.builtin.apt:
        name:
          - rsync
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Sync changed files and back up overwritten remote files
      ansible.builtin.command:
        cmd: >
          rsync -rlt
          --backup
          --backup-dir="{{ rsync_backup_dir }}"
          --suffix=.bak
          --itemize-changes
          --rsync-path="sudo -n rsync"
          --chmod=Du=rwx,Dg=rwx,Do=rx,Fu=rwx,Fg=rwx,Fo=rx
          "{{ src_repo }}/"
          "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}:{{ dest_dir }}/"
      delegate_to: localhost
      become: false