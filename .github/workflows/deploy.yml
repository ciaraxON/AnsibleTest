name: Deploy via Ansible

on:
  push:
    branches: [ "main" ]
    paths:
      - "filestodeploy/**"
      - "ansible/**"

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible + SSH client
        run: |
          sudo apt update
          sudo apt install -y ansible openssh-client rsync

      - name: Setup SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H 192.168.1.137 >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Configure SSH for Ansible
        shell: bash
        run: |
          cat >> "$HOME/.ssh/config" <<'EOF'
          Host 192.168.1.137
            HostName 192.168.1.137
            User ubuntu
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 "$HOME/.ssh/config"

      - name: Test SSH connectivity (will fail if runner can't reach LAN)
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 192.168.1.137 "echo connected"

      - name: Test Ansible connectivity
        working-directory: ansible
        run: |
          ansible -m ping virtuabox

      - name: Run deploy playbook
        working-directory: ansible
        run: |
          ansible-playbook deploy.yml -e "release_id=${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"